name: Release APK

on:
  push:
    tags:
      - 'v*-debug'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-debug). Created if it does not exist.'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Reject anything outside [A-Za-z0-9._-] so we don't smuggle shell.
            case "$INPUT_TAG" in
              ''|*[!A-Za-z0-9._-]*)
                echo "Invalid tag: $INPUT_TAG" >&2
                exit 1
                ;;
            esac
            printf 'name=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            printf 'name=%s\n' "${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci

      # The APK ships to members straight off this tag, so the gate runs here
      # rather than only on PRs — a tag pushed from a branch that skipped CI
      # used to build and publish regardless.
      - name: Test
        run: npm test

      - name: Build and sync Capacitor
        run: npm run build:mobile && npx cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          # Version stamps derive from the tag (v0.2.0 -> name 0.2.0, monotonically
          # increasing code from the run number so updates always install over
          # the previous release).
          export ANDROID_VERSION_NAME="${TAG#v}"
          export ANDROID_VERSION_CODE="$GITHUB_RUN_NUMBER"
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/coms-member.apk

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: COMS Member App ${{ steps.tag.outputs.name }}
          files: out/coms-member.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
